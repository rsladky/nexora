[project]
name = "nexora-ml"
version = "0.1.0"
description = "Collecte de landmarks et entraînement du classifieur de gestes Nexora (export ONNX)"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy",
    "opencv-python",
    "mediapipe",
    "scikit-learn",
    "torch",
    "onnx",
]

[dependency-groups]
# Conversion tflite -> ONNX (scripts/fetch_models.py). Non nécessaire à l'exécution.
convert = ["tensorflow", "tf2onnx", "onnxruntime"]
