name: Bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: textarea
    id: constat
    attributes:
      label: Ce qui se passe / ce qui était attendu
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "OS, session (Wayland/X11), caméra, version"
